version: '3.6'
services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    image: techaid-api:1.0.0
    # Fixed name: the README's `docker exec -it techaid-server-web-1 bash` step uses it.
    container_name: techaid-server-web-1
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
      DATASOURCE_PASSWORD: ${DB_PASS}
      DATASOURCE_URL: ${DB_URL}
      DATASOURCE_USERNAME: ${DB_USER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID:
      AUTH0_CLIENT_SECRET:
      JWT_ISSUER: ${JWT_ISSUER}
      GMAIL_CLIENT_ID:
      GMAIL_CLIENT_SECRET:
      GMAIL_REFRESH_TOKEN:
      # validate, as in UAT/production: Flyway owns the schema, Hibernate only checks it.
      DDL_AUTO: ${DDL_AUTO:-validate}
      SHOW_SQL: "${SHOW_SQL:-true}"
      TOKEN_ATTRIBUTE: ${TOKEN_ATTRIBUTE}
      DEV_APP: "https://app-testing.communitytechaid.org.uk/"
      TYPEFORM_KEY: ${TYPEFORM_KEY}
      # Required: the app refuses to start without it (RequiredConfigurationCheck). It grants full
      # authorities via the X-Auth-Admin-Secret header, so use a long random local-only value.
      AUTH_ADMIN_SECRET: ${AUTH_ADMIN_SECRET:?set AUTH_ADMIN_SECRET in .env}
    command: []
    volumes:
      - ./src/main/resources/application-local.yml:/app/config/application-local.yml:ro
      - ./src/main/resources/application.yml:/app/config/application.yml:ro
      - ./src/main/resources/db:/db
      - ./src:/app/src
    depends_on:
      - postgres
    ports:
      # Bound to localhost only: never expose a dev API (or the admin secret) to the LAN.
      - 127.0.0.1:${PORT:-8080}:8080
#  proxy:
#    image: nginx:1.16-alpine
#    depends_on:
#      - web
#    ports:
#      - 8080:80
#    volumes:
#      - ./docker/proxy.conf:/etc/nginx/nginx.conf
  postgres:
    #using the latest version of postgres
    image: postgres:16
    environment:
      POSTGRES_DB: techaid_api
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - 127.0.0.1:5423:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 127.0.0.1:8900:8080

volumes:
  pgdata: {}

networks:
  # Explicit name, kept for stability. Nothing outside this file joins it any more: the dashboard
  # reaches the API via localhost:8080.
  default:
    name: techaid-server_default
