name: Dependency submission

# GitHub cannot build a dependency graph for a Gradle project by reading build.gradle: it needs
# the resolved graph submitted from a real Gradle run. Without this workflow the graph held only
# the GitHub Actions used by the workflows, so Dependabot raised no alert for ANY Java/Kotlin
# library - Spring, Jackson, Auth0 and the rest were invisible to it.
#
# Submitting on every push to dev keeps the graph matching the default branch, which is what
# Dependabot alerts are computed against.

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Pinned to a commit: this action runs with contents:write.
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
