name: Daily security scan

# Dependabot only sees declared library manifests. It never sees what actually ships: the Alpine
# base image, the JRE, the Application Insights agent jar. This scans what is RUNNING - the images
# api-production and api-testing are on right now, and the dashboard as last deployed to
# production (techaid-dashboard's master, which its deploy-prod.yml fast-forwards on every deploy)
# - and opens one issue per new Critical/High vulnerability, assigned so that it emails.
#
# One issue per (vulnerability, package), ever. An issue closed as not-relevant is never reopened
# or re-raised; if that decision changes, reopen it by hand.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  ASSIGNEE: TheKentuckian
  LABEL: security-scan
  # A first run on a never-scanned image can find dozens of issues at once. Cap how many are
  # opened per run so the first email burst is readable; the rest follow on later days.
  MAX_NEW_ISSUES: 15

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
      issues: write

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read the running images rather than inferring them from a branch: master or the latest
      # tag can disagree with what production actually runs.
      - name: Resolve running images
        id: images
        run: |
          for app in api-production api-testing; do
            img=$(az containerapp show --name "$app" --resource-group tada-2026 \
              --query "properties.template.containers[0].image" --output tsv)
            echo "$app runs $img"
            echo "${app//-/_}=$img" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out deployed dashboard
        uses: actions/checkout@v5
        with:
          repository: CommunityTechaid/techaid-dashboard
          ref: master
          path: dashboard

      # Pinned to a commit: a scanner is exactly the kind of action an attacker would want to
      # replace, and this job holds an Azure login.
      - name: Scan production image
        id: prod
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.images.outputs.api_production }}
          fail-build: false
          by-cve: true
          output-format: json

      - name: Scan UAT image
        id: uat
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.images.outputs.api_testing }}
          fail-build: false
          by-cve: true
          output-format: json

      - name: Scan dashboard
        id: dashboard
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: dashboard
          fail-build: false
          by-cve: true
          output-format: json

      - name: Open issues for new Critical/High findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROD_JSON: ${{ steps.prod.outputs.json }}
          UAT_JSON: ${{ steps.uat.outputs.json }}
          DASH_JSON: ${{ steps.dashboard.outputs.json }}
          PROD_IMAGE: ${{ steps.images.outputs.api_production }}
          UAT_IMAGE: ${{ steps.images.outputs.api_testing }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color B60205 \
            --description "Opened by the daily security scan" --force

          # Flatten each report to one row per finding, tagged with where it was found.
          flatten() {
            jq -c --arg target "$2" '.matches[]
              | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")
              | {id: .vulnerability.id, severity: .vulnerability.severity,
                 pkg: .artifact.name, version: .artifact.version, type: .artifact.type,
                 fix: ((.vulnerability.fix.versions // []) | join(", ")),
                 url: (.vulnerability.dataSource // ""),
                 path: (.artifact.locations[0].path // ""), target: $target}' "$1"
          }
          {
            flatten "$PROD_JSON" "production ($PROD_IMAGE)"
            flatten "$UAT_JSON" "UAT ($UAT_IMAGE)"
            flatten "$DASH_JSON" "dashboard (techaid-dashboard master)"
          } > findings.jsonl

          # Group by (vulnerability, package); Critical first.
          jq -s -c 'group_by(.id + "|" + .pkg)
            | map({id: .[0].id, pkg: .[0].pkg, severity: .[0].severity, type: .[0].type,
                   url: .[0].url, rows: .})
            | sort_by(if .severity == "Critical" then 0 else 1 end)[]' findings.jsonl > grouped.jsonl

          gh issue list --label "$LABEL" --state all --limit 1000 --json title \
            --jq '.[].title' > existing.txt

          total=$(wc -l < grouped.jsonl); created=0; deferred=0
          while read -r g; do
            id=$(jq -r .id <<<"$g"); pkg=$(jq -r .pkg <<<"$g"); sev=$(jq -r .severity <<<"$g")
            title="Security: $id in $pkg"
            # Severity is left out of the match: a re-scored advisory is still the same issue.
            grep -qF "$title (" existing.txt && continue
            if [ "$created" -ge "$MAX_NEW_ISSUES" ]; then deferred=$((deferred + 1)); continue; fi

            body=$(jq -r '"**\(.severity)** `\(.id)` in `\(.pkg)` (\(.type))\n\nAdvisory: \(.url)\n\n"
              + "| Where | Installed | Fixed in | Path |\n|---|---|---|---|\n"
              + (.rows | map("| \(.target) | \(.version) | \(.fix // "no fix yet") | `\(.path)` |") | join("\n"))
              + "\n\nOpened by the daily security scan. Close this issue if it does not apply; it will not be re-raised."' <<<"$g")
            gh issue create --title "$title ($sev)" --body "$body" \
              --label "$LABEL" --assignee "$ASSIGNEE"
            created=$((created + 1))
          done < grouped.jsonl

          {
            echo "### Daily security scan"
            echo "- Critical/High findings (unique vulnerability + package): $total"
            echo "- New issues opened: $created"
            if [ "$deferred" -gt 0 ]; then
              echo "- Deferred to later runs (cap $MAX_NEW_ISSUES): $deferred"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
