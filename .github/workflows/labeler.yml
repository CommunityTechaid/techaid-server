name: Label pull requests

# pull_request_target so the label can be written on PRs from forks too. Safe here because the
# labeler only reads the list of changed files; it never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
