name: CI/CD

on:
  push:
    branches: [dev, main, 'maintenance/**']
  # PRs run the gates only (see the `build` guard below). Without this, no PR ever ran CI and
  # verification happened only after merge, when it could no longer block anything.
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/

  build:
    needs: test
    # Push events only. On a pull_request the image tags below would resolve to :dev and
    # :dev-<sha>, publishing UNMERGED code to the tag UAT deploys from and that promote.yml
    # treats as "the image currently running on UAT". PRs must run the gates, not publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA::7}"
          # Project version from build.gradle (release-please bumps this on dev).
          # Tolerates a trailing `// x-release-please-version` annotation comment.
          VERSION=$(grep -E "^version = " build.gradle | head -1 | sed -E "s/^version = '([^']*)'.*/\1/")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # main = production-ready; tag as :latest, :<sha> and :v<version>
            echo "tags=${IMAGE}:${SHA},${IMAGE}:latest,${IMAGE}:v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # dev / maintenance branches = UAT; tag as :dev-<sha> and :v<version>. :dev itself is
            # moved by deploy-testing, so it always names what api-testing runs.
            echo "tags=${IMAGE}:dev-${SHA},${IMAGE}:v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-testing:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Merges close together start overlapping runs. Without this, each deploy races the others:
    # on 2026-10-24 three ran at once, one failed with ContainerAppOperationInProgress and an
    # older image could have finished last. One deploy at a time. Not cancel-in-progress: an az
    # update cut off half-way is worse than one that finishes and is superseded.
    # Serialising is not ordering: builds finish in any order, so on 2026-10-27 the older of two
    # merges deployed last and rolled UAT back. The order check below skips a deploy when
    # api-testing already runs a newer commit.
    concurrency:
      group: deploy-testing
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Skip if api-testing already runs a newer commit
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(az containerapp show --name api-testing --resource-group tada-2026 \
            --query "properties.template.containers[0].image" -o tsv)
          DEPLOYED="${CURRENT##*:dev-}"
          REL=unknown
          # Only compare when api-testing runs a dev-<sha> image; anything else gets replaced.
          if [ "$DEPLOYED" != "$CURRENT" ]; then
            REL=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEPLOYED}...${GITHUB_SHA}" --jq .status || echo unknown)
          fi
          if [ "$REL" = "behind" ]; then
            echo "::notice::api-testing already runs ${DEPLOYED}, which is newer than ${GITHUB_SHA::7}; not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to api-testing
        if: steps.order.outputs.deploy == 'true'
        run: |
          az containerapp update \
            --name api-testing \
            --resource-group tada-2026 \
            --image ghcr.io/communitytechaid/techaid-server:dev-${GITHUB_SHA::7}

      - name: Log in to GitHub Container Registry
        if: steps.order.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The daily image scan reads :dev as "what UAT runs".
      - name: Point :dev at the deployed image
        if: steps.order.outputs.deploy == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/communitytechaid/techaid-server:dev \
            ghcr.io/communitytechaid/techaid-server:dev-${GITHUB_SHA::7}
