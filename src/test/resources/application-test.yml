# Test OVERLAY on src/main/resources/application.yml — it does not replace it.
#
# Activated by `spring.profiles.active=test`, set in build.gradle's `test` block. Anything
# not overridden here comes from the main application.yml, so tests run against the config
# that actually ships (open-in-view: false, ddl-auto: validate, the lazy-load settings...).
#
# This file was called application.yml until issue #105. Both files landed at the classpath
# root, Gradle put test resources first, and Spring read only this one — so no test had ever
# seen the real config. Do NOT rename it back. MainApplicationConfigVisibilityTest guards this.
auth0:
  token-attribute: https://test.example.com
  audience: ''
  domain: ''
  client-id: ''
  client-secret: ''

auth:
  admin-secret: password

spring:
  graphql:
    schema:
      inspection:
        # SchemaMappingInspector fails after Kotlin 2.x upgrade due to null method reflection issue.
        # TODO: find the specific mapping and fix it; re-enable when resolved.
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test.example.com/

gmail:
  client-id: ''
  client-secret: ''
  refresh-token: ''
  address: test@example.com
  enabled: false
  bcc-address: test@example.com

typeform:
  key: ''

google:
  places:
    key: ''
    # Closed port: geocoding attempts in tests fail fast instead of calling Google.
    url: http://127.0.0.1:1/geocode

turnstile:
  # Disabled so anonymous submits (PublicSurfaceAuthorizationTest) and the booking tests run
  # without a token; closed-port url guards against an accidental live siteverify call.
  enabled: false
  secret: ''
  url: http://127.0.0.1:1/siteverify

delivery-booking:
  enforce-feature-flag: false
  rate-limit:
    # High cap so the existing DeliveryMutationsTest (9+ submits from one IP) isn't throttled.
    max-requests: 1000

zonky:
  test:
    database:
      # Use embedded Postgres binaries instead of the (default) Docker provider so the
      # DB-backed tests run without a Docker daemon, locally and in CI.
      provider: zonky
